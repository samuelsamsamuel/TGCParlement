name: Listes fermées et cartes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  listes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CONTACT: votre.adresse@exemple.fr
    steps:
      - uses: actions/checkout@v4

      - name: Base des sénateurs (open data du Sénat)
        run: python3 scripts/senateurs.py

      - name: Cartes, première passe
        run: python3 scripts/cartes.py > /dev/null

      - name: Gouvernements de la Libération et de la IVe République
        continue-on-error: true
        run: python3 scripts/gouvernements_ive.py

      - name: Gouvernements récents (open data de l'Assemblée)
        continue-on-error: true
        run: python3 scripts/gouvernements_an.py

      - name: Fonctions au sein du Sénat
        continue-on-error: true
        run: python3 scripts/senat_fonctions.py

      - name: Bureau du Sénat (mesure, export complet)
        continue-on-error: true
        run: python3 scripts/senat_bureau.py

      - name: Gouvernements (Libération, IVe et Ve Républiques)
        run: python3 scripts/gouvernements.py

      - name: Quatre-vingts du 10 juillet 1940
        run: python3 scripts/quatre_vingts.py

      - name: Doyens d'âge (mesure)
        continue-on-error: true
        run: python3 scripts/doyens.py

      - name: Présidences de l'Assemblée
        run: python3 scripts/presidences.py

      - name: Présidences du Sénat
        run: python3 scripts/presidences_senat.py

      - name: Distinctions (Libération, Académie, Nobel, Panthéon)
        continue-on-error: true
        run: python3 scripts/distinctions.py

      - name: Cartes, version finale
        run: python3 scripts/cartes.py

      - name: Portraits (Wikidata)
        continue-on-error: true
        run: python3 scripts/portraits.py

      - name: Plus grande ville des circonscriptions
        continue-on-error: true
        run: python3 scripts/villes_circonscriptions.py

      - name: Export pour l'application
        run: python3 scripts/export_jeu.py

      - name: Enregistrement
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet || git commit -m "Sénateurs, listes fermées et cartes du $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
