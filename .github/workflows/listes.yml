name: Listes fermées

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  listes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Présidences de l'Assemblée
        env:
          CONTACT: sdeazevedo@icloud.com
        run: python3 scripts/presidences.py

      - name: Enregistrement
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listes
          git diff --cached --quiet || git commit -m "Listes fermées : propositions du $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
