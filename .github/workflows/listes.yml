name: Listes fermées et cartes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  listes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Présidences de l'Assemblée
        env:
          CONTACT: votre.adresse@exemple.fr
        run: python3 scripts/presidences.py

      - name: Présidences du Sénat
        run: python3 scripts/presidences_senat.py

      - name: Construction des cartes
        run: python3 scripts/cartes.py

      - name: Enregistrement
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listes data/cartes.json data/controle.txt
          git diff --cached --quiet || git commit -m "Listes fermées et cartes du $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
