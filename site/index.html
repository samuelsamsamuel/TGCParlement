<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hémicycle — cartes des parlementaires depuis 1789</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --velours:#5c1020; --velours-fonce:#2e0710; --dorure:#c9a24a; --dorure-pale:#e6d29a;
  --marbre:#efe9df; --encre:#21161a; --pierre:#8d8378;
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--velours-fonce);color:var(--marbre);font:16px/1.5 var(--sans);min-height:100vh}
a{color:var(--dorure-pale)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--dorure);outline-offset:3px}
header{background:radial-gradient(120% 140% at 50% 120%,var(--velours) 0%,var(--velours-fonce) 70%);padding:1.6rem 1rem 0;text-align:center;overflow:hidden}
h1{font:400 clamp(2rem,6vw,3.4rem)/1 var(--serif);margin:0 0 .3rem}
.chapeau{margin:0 auto 1rem;max-width:34rem;color:var(--dorure-pale);font-size:.95rem}
nav{display:flex;justify-content:center;gap:.25rem;border-top:1px solid rgba(201,162,74,.35)}
nav button{background:none;border:0;color:var(--marbre);padding:.85rem 1.1rem;border-bottom:3px solid transparent;font-weight:500}
nav button[aria-selected="true"]{border-bottom-color:var(--dorure);color:var(--dorure-pale)}
main{max-width:1120px;margin:0 auto;padding:1.5rem 1rem 4rem}
.vue[hidden]{display:none}
.bouton{background:var(--dorure);color:var(--encre);border:0;border-radius:3px;padding:.8rem 1.5rem;font-weight:600;font-size:1rem}
.bouton.discret{background:none;color:var(--dorure-pale);border:1px solid rgba(201,162,74,.5);font-weight:500}
.message{color:var(--dorure-pale);text-align:center;margin:0 0 1rem}

/* ---------- Le paquet (booster) ---------- */
.scene{display:flex;flex-direction:column;align-items:center;gap:1rem;min-height:500px}
.paquet{--h:420px;width:calc(var(--h) * .62);height:var(--h);max-height:72vh;max-width:62vw;border:0;padding:0;background:none;position:relative;filter:drop-shadow(0 22px 30px rgba(0,0,0,.55))}
.paquet .corps-paquet{position:absolute;left:0;right:0;top:7%;bottom:5%;overflow:hidden;
  background:
    linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 42%,transparent 54%) 0 0/250% 100%,
    conic-gradient(from 210deg at 50% 45%,#7a1a2e,#b8293a,#5c1020,#2c3e7a,#5c1020,#7a1a2e);
  animation:brillance 4s linear infinite}
@keyframes brillance{from{background-position:130% 0,0 0}to{background-position:-130% 0,0 0}}
.paquet .corps-paquet::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px)}
.paquet .bordure{position:absolute;inset:5% 6%;border:2px solid rgba(230,210,154,.8);border-radius:6px}
.paquet .logo{position:absolute;left:0;right:0;top:12%;text-align:center}
.paquet .logo strong{display:block;font:700 clamp(1.6rem,6vw,2.3rem)/1 var(--serif);color:#fff;text-shadow:0 2px 0 #8a6a1c,0 0 18px rgba(230,210,154,.6)}
.paquet .logo span{display:block;margin-top:.35rem;font-size:.72rem;font-weight:600;color:var(--dorure-pale)}
.paquet .eventail{position:absolute;left:50%;top:36%;width:46%;aspect-ratio:5/7;transform:translateX(-50%)}
.paquet .eventail i{position:absolute;inset:0;border-radius:6px;border:2px solid var(--dorure);
  background:radial-gradient(circle,rgba(201,162,74,.35) 0 20%,transparent 21%),repeating-linear-gradient(135deg,#5c1020 0 7px,#7a1a2e 7px 14px)}
.paquet .eventail i:nth-child(1){transform:rotate(-14deg) translateX(-18%)}
.paquet .eventail i:nth-child(2){transform:rotate(12deg) translateX(18%)}
.paquet .eventail i:nth-child(3){background:radial-gradient(circle at 50% 42%,#f1dc9a,#c9a24a 45%,#8a6a1c);display:grid;place-items:center}
.paquet .eventail b{font:700 2.2rem var(--serif);color:var(--velours-fonce)}
.paquet .mention{position:absolute;left:0;right:0;bottom:9%;text-align:center;font-weight:700;font-size:.9rem;color:#fff}
.paquet .mention em{display:inline-block;background:var(--dorure);color:var(--encre);font-style:normal;border-radius:1em;padding:.1em .7em;margin-right:.3em}
/* soudures crantées en haut et en bas */
.paquet .soudure{position:absolute;left:0;right:0;height:8%;
  background:repeating-linear-gradient(90deg,#a9822f 0 3px,#ecd796 3px 6px);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.paquet .soudure.haut{top:0;transform:scaleY(-1);transform-origin:center;transition:transform .5s ease,opacity .5s}
.paquet .soudure.bas{bottom:0;height:6%}
.paquet .ligne-ouverture{position:absolute;left:4%;right:4%;top:9.5%;border-top:2px dashed rgba(255,255,255,.55)}
.paquet:hover .soudure.haut{transform:scaleY(-1) translateY(6px) rotate(-1.5deg)}
.paquet.ouvert .soudure.haut,.paquet.ouvert .ligne-ouverture{transform:scaleY(-1) translate(30%,160%) rotate(-12deg);opacity:0}
.paquet.ouvert .corps-paquet,.paquet.ouvert .soudure.bas{transform:translateY(55%);opacity:0;transition:transform .6s .3s ease-in,opacity .6s .3s}
.progres{font-size:.95rem;color:var(--dorure-pale);text-align:center;margin:0}

/* ---------- La carte ---------- */
.carte{position:relative;width:100%;aspect-ratio:5/7.2;container-type:inline-size;perspective:1400px;border:0;padding:0;background:none;color:inherit;text-align:left;display:block}
.carte.grande{width:min(320px,80vw);cursor:pointer}
.face{position:absolute;inset:0;border-radius:4.5% / 3.2%;backface-visibility:hidden;transition:transform .65s cubic-bezier(.2,.75,.2,1);font-size:6.6cqw}
.dos{background:radial-gradient(circle at 50% 50%,rgba(201,162,74,.3) 0 18%,transparent 19%),repeating-linear-gradient(135deg,#5c1020 0 9px,#651326 9px 18px);border:.35em solid var(--dorure);display:grid;place-items:center}
.dos span{font:italic 400 1.15em var(--serif);color:var(--dorure-pale)}
.recto{transform:rotateY(180deg);background:var(--cadre);padding:.42em;display:flex;flex-direction:column;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.verso{transform:rotateY(180deg);background:var(--cadre);padding:.42em;display:flex;flex-direction:column;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.carte.retournee .dos{transform:rotateY(-180deg)}
.carte.retournee .recto{transform:rotateY(0)}
.carte.retournee.envers .recto{transform:rotateY(-180deg)}
.carte.retournee.envers .verso{transform:rotateY(0)}
.carte.statique .face{transition:none}
.interieur{flex:1;background:var(--marbre);color:var(--encre);border-radius:3% / 2%;display:flex;flex-direction:column;overflow:hidden}
.entete{display:flex;justify-content:space-between;align-items:flex-start;gap:.4em;padding:.38em .5em .32em .6em;background:var(--cadre);color:var(--sur-cadre)}
.entete .nom{font:700 .9em/1.12 var(--serif);margin:0;overflow-wrap:anywhere;hyphens:auto}
.entete .rarete{flex:none;font-size:.55em;font-weight:700;padding:.2em .55em;border-radius:1em;background:var(--marbre);color:var(--rarete-texte)}
.portrait{position:relative;flex:0 0 40%;background:linear-gradient(#d9cfc0,#bfb2a0);overflow:hidden;border-bottom:.18em solid var(--rarete-texte)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:sepia(.15)}
.portrait .initiales{position:absolute;inset:0;display:grid;place-items:center;font:400 2.6em var(--serif);color:rgba(46,7,16,.5)}
.portrait .chambres{position:absolute;left:.35em;bottom:.35em;display:flex;gap:.22em;flex-wrap:wrap}
.portrait .actuel{position:absolute;right:.35em;top:.35em;background:#b8293a;color:#fff;font-size:.52em;font-weight:700;padding:.15em .5em;border-radius:1em}
.epoque{font-size:.52em;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:.25em .6em;color:#fff;background:var(--ep)}
.principale{padding:.45em .55em .2em}
.principale b{display:block;font:700 .74em/1.2 var(--serif);color:var(--velours)}
.principale span{display:block;font-size:.56em;color:#6b5f55;margin-top:.1em}
.portrait .chambres span{background:rgba(46,7,16,.86);color:var(--marbre);font-size:.52em;font-weight:600;padding:.12em .45em;border-radius:1em}
.corps{padding:.35em .5em .2em;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.lignes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.18em}
.lignes li{font-size:.56em;line-height:1.25;border-bottom:1px dotted #cfc2ad;padding-bottom:.18em}
.lignes li b{font-weight:600;display:block}
.lignes li span{display:block;color:#6b5f55}
.lignes li.fonction b{color:var(--velours)}
.verso .titre-verso{font:700 .8em/1.15 var(--serif);margin:0;padding:.45em .55em;background:var(--cadre);color:var(--sur-cadre)}
.verso h4{margin:.5em 0 .2em;font-size:.56em;font-weight:700;text-transform:uppercase;color:var(--rarete-texte)}
.verso .lien{font-size:.56em;padding:.3em .55em .4em}
.verso .lien a{color:var(--velours)}
.actions{display:flex;gap:.5rem;justify-content:center;width:min(320px,80vw)}
.actions .bouton{flex:1;padding:.7rem .6rem;font-size:.92rem}
.pied{display:flex;justify-content:space-between;align-items:center;padding:.25em .55em .35em;font-size:.6em;border-top:1px solid #d8ccb8}
.pied .score{font-weight:700}
.pied .double{background:var(--velours);color:var(--marbre);border-radius:1em;padding:0 .5em;font-weight:600}
.pied .neuve{color:var(--velours);font-weight:700}

.r-legendaire{--cadre:linear-gradient(145deg,#f1dc9a,#c9a24a 40%,#8a6a1c 70%,#e6d29a);--sur-cadre:#2e0710;--rarete-texte:#8a6a1c}
.r-epique{--cadre:linear-gradient(145deg,#b07ac2,#6d3480);--sur-cadre:#fff;--rarete-texte:#6d3480}
.r-rare{--cadre:linear-gradient(145deg,#6d9bcb,#2c5583);--sur-cadre:#fff;--rarete-texte:#2c5583}
.r-peu-commune{--cadre:linear-gradient(145deg,#7fa487,#3e6447);--sur-cadre:#fff;--rarete-texte:#3e6447}
.r-commune{--cadre:linear-gradient(145deg,#b3aa9e,#7c7368);--sur-cadre:#fff;--rarete-texte:#5f554b}
.r-hors-categorie{--cadre:linear-gradient(145deg,#2c3e7a 0 33%,#efe9df 33% 66%,#b8293a 66%);--sur-cadre:#21161a;--rarete-texte:#5c1020}
.r-hors-categorie .entete{background:#efe9df}
.r-legendaire.retournee .recto{box-shadow:0 0 0 1px #f1dc9a,0 0 40px rgba(201,162,74,.6),0 10px 26px rgba(0,0,0,.4)}
.r-legendaire .recto::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 45%,transparent 55%);background-size:250% 100%;animation:reflet 3.5s linear infinite}
@keyframes reflet{from{background-position:120% 0}to{background-position:-120% 0}}

/* ---------- Grilles : deux cartes par ligne sur téléphone ---------- */
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem;width:100%}
@media (min-width:640px){.grille{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:960px){.grille{grid-template-columns:repeat(5,minmax(0,1fr))}}
.grille .carte{cursor:pointer}
.recap{max-width:900px}
.outils{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.2rem}
.outils input,.outils select{background:var(--velours-fonce);color:var(--marbre);border:1px solid rgba(201,162,74,.5);border-radius:3px;padding:.55rem .7rem;font:inherit}
.outils input{flex:1;min-width:12rem}
.progression{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.4rem 1.2rem;margin:0 0 1.5rem;padding:0;list-style:none;font-size:.9rem}
.progression strong{font:700 1.25rem var(--serif);display:block;color:var(--dorure-pale)}
.vide{color:var(--dorure-pale);text-align:center;padding:3rem 1rem;grid-column:1/-1}

/* ---------- Détail ---------- */
dialog{border:0;padding:0;background:transparent;color:var(--marbre);width:min(820px,94vw)}
dialog::backdrop{background:rgba(20,3,8,.85)}
.detail{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:1.4rem;background:var(--velours-fonce);border:1px solid rgba(201,162,74,.5);border-radius:8px;padding:1.3rem;max-height:90vh;overflow:auto}
@media (max-width:620px){.detail{grid-template-columns:1fr}.detail .carte{max-width:240px;margin:0 auto}}
.detail h2{font:700 1.45rem/1.2 var(--serif);margin:0 0 .8rem}
.detail h3{font:600 .95rem var(--sans);color:var(--dorure-pale);margin:1rem 0 .4rem}
.detail ul{margin:0;padding:0;list-style:none}
.detail li{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid rgba(201,162,74,.2);font-size:.92rem}
.detail li span{flex:none;color:var(--dorure-pale)}
.detail .credit{font-size:.8rem;color:var(--pierre)}
footer{max-width:1120px;margin:0 auto;padding:0 1rem 3rem;font-size:.85rem;color:var(--pierre)}
@media (prefers-reduced-motion:reduce){.face,.paquet *{transition:none!important;animation:none!important}.r-legendaire .recto::after{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Hémicycle</h1>
  <p class="chapeau">Collectionnez les parlementaires français, de la Constituante de 1789 à l'Assemblée d'aujourd'hui.</p>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" aria-selected="true" data-vue="paquet">Ouvrir un paquet</button>
    <button role="tab" aria-selected="false" data-vue="collection">Ma collection</button>
  </nav>
</header>
<main>
  <section class="vue" id="vue-paquet">
    <p class="message" id="restants" aria-live="polite">Chargement des cartes…</p>
    <div class="scene" id="scene"></div>
  </section>
  <section class="vue" id="vue-collection" hidden>
    <ul class="progression" id="progression"></ul>
    <div class="outils">
      <input id="recherche" type="search" aria-label="Rechercher dans ma collection" placeholder="Rechercher un nom, un département, un ministère">
      <select id="filtre" aria-label="Filtrer par rareté"><option value="">Toutes les raretés</option></select>
      <select id="tri" aria-label="Trier"><option value="score">Par score</option><option value="nom">Par nom</option><option value="annee">Par date</option></select>
    </div>
    <div class="grille" id="grille"></div>
  </section>
</main>
<footer>Données : Assemblée nationale (Sycomore et open data), Sénat (open data), data.gouv.fr. Portraits : Wikimedia Commons, crédits dans le détail de chaque carte.</footer>

<script>
const PAQUETS_PAR_JOUR = 3, CARTES_PAR_PAQUET = 5;
const LIBELLES = {"legendaire":"Légendaire","epique":"Épique","rare":"Rare","peu-commune":"Peu commune","commune":"Commune","hors-categorie":"Hors catégorie"};
const ORDRE = ["commune","peu-commune","rare","epique","hors-categorie","legendaire"];
const POIDS = {"legendaire":2,"epique":7,"rare":18,"peu-commune":30,"commune":40,"hors-categorie":3};
const CHAMBRES = {"A":"Assemblée","S":"Sénat","G":"Gouvernement"};
const EPOQUES = {"Révolution et Empire":"#6b4a2b","Monarchies constitutionnelles":"#3d5a73","IIe République et Second Empire":"#5b4b7a",
  "IIIe République":"#2f6b5a","Libération et IVe République":"#7a5a1e","Ve République":"#2c3e7a","":"#5c1020"};
const AUTRES = {"quatre-vingts":"Parmi les Quatre-vingts (10 juillet 1940)","femmes-1945":"Parmi les premières élues (1945)",
  "1789":"Constituant de 1789","convention":"Membre de la Convention","doyen-benjamin":"Doyen d'âge ou benjamin d'une législature",
  "deux-chambres":"A siégé dans les deux chambres"};
const CLE = "hemicycle-collection";
let cartes = [], parRarete = {}, actuelsParRarete = {};
let etat = charger();

function charger(){ try { const e = JSON.parse(localStorage.getItem(CLE)); if (e && e.possedees) return e; } catch(_) {} return {possedees:{}, jour:"", ouverts:0}; }
function sauver(){ try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch(_) {} }
function aujourdhui(){ const d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function restants(){ if (etat.jour !== aujourdhui()) { etat.jour = aujourdhui(); etat.ouverts = 0; sauver(); } return PAQUETS_PAR_JOUR - etat.ouverts; }
function echapper(t){ return String(t ?? "").replace(/[&<>"]/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[s])); }
function tirerRarete(pool){ let x = Math.random()*Object.values(POIDS).reduce((a,b)=>a+b,0); for (const [r,p] of Object.entries(POIDS)) if ((x -= p) < 0 && pool[r]?.length) return r; return Object.keys(pool).find(r => pool[r]?.length); }
function tirerCarte(pool=parRarete){ const l = pool[tirerRarete(pool)]; return l[Math.floor(Math.random()*l.length)]; }
function dates(d,f,enCours=true){ if (!d) return ""; if (f === null || f === undefined) return enCours ? "depuis "+d : String(d); return d===f ? String(d) : d+"–"+f; }
function initiales(nom){ const m = nom.split(" ").filter(Boolean); return (m[0]?.[0]||"") + (m.length>1 ? m[m.length-1][0] : ""); }
function urlPortrait(f, l=420){ return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f)+"?width="+l; }
function mandatLigne(m){
  const periodes = (m[2]||[]).map(p => dates(p[0], p[1])).join(", ");
  return [m[0] + (m[1] ? " (" + m[1] + ")" : ""), periodes + (m[3] > 1 ? ", " + m[3] + " mandats" : "")];
}
function principale(c){
  if (c.fonctions.length) { const f = c.fonctions[0]; return [f[0], dates(f[1], f[2], false)]; }
  if (c.mandats.length) return mandatLigne(c.mandats[0]);
  return ["", ""];
}
function listeLignes(items){ return items.map(([k,t,d]) => `<li class="${k}"><b>${echapper(t)}</b><span>${d}</span></li>`).join(""); }

function htmlCarte(c, {retournee=true, neuve=false, classe="", id=""}={}){
  const n = etat.possedees[c.id] || 0;
  const portrait = c.portrait ? `<img src="${urlPortrait(c.portrait)}" alt="" loading="lazy" onerror="this.remove()">` : `<span class="initiales">${echapper(initiales(c.nom))}</span>`;
  const [pt, pd] = principale(c);
  const autresFonctions = c.fonctions.slice(1).map(f => ["fonction", f[0], dates(f[1], f[2], false)]);
  const mandats = c.mandats.map(m => ["mandat", ...mandatLigne(m)]).filter(x => !(c.fonctions.length === 0 && x[1] === pt));
  const distinctions = c.distinctions.filter(d => AUTRES[d]).map(d => AUTRES[d]);
  const pied = `<div class="pied"><span class="score">Score : ${c.score.toLocaleString("fr-FR")}</span>${neuve?'<span class="neuve">Nouvelle</span>':(n>1?`<span class="double">×${n}</span>`:"")}</div>`;
  return `<div class="carte r-${c.rarete} ${retournee?"retournee statique":""} ${classe}" data-id="${c.id}" ${id?`id="${id}"`:""} style="--ep:${EPOQUES[c.epoque]||EPOQUES[""]}">
    <div class="face dos"><span>Hémicycle</span></div>
    <div class="face recto"><div class="interieur">
      <div class="entete"><h3 class="nom">${echapper(c.nom)}</h3><span class="rarete">${LIBELLES[c.rarete]}</span></div>
      <div class="portrait">${portrait}<div class="chambres">${[...c.chambres].map(x=>`<span>${CHAMBRES[x]}</span>`).join("")}</div>${c.actuel?'<span class="actuel">En exercice</span>':""}</div>
      <div class="epoque">${echapper(c.epoque || "Gouvernement")}</div>
      <div class="principale"><b>${echapper(pt)}</b><span>${pd}</span></div>
      <div class="corps"><ul class="lignes">${listeLignes(autresFonctions.concat(mandats).slice(0,3))}${autresFonctions.length+mandats.length>3?`<li class="mandat"><span>Toute la carrière au verso</span></li>`:""}</ul></div>
      ${pied}
    </div></div>
    <div class="face verso"><div class="interieur">
      <p class="titre-verso">${echapper(c.nom)}</p>
      <div class="corps">
        ${c.fonctions.length?`<h4>Fonctions</h4><ul class="lignes">${listeLignes(c.fonctions.map(f => ["fonction", f[0], dates(f[1], f[2], false)]))}</ul>`:""}
        ${c.mandats.length?`<h4>Mandats</h4><ul class="lignes">${listeLignes(c.mandats.map(m => ["mandat", ...mandatLigne(m)]))}</ul>`:""}
        ${distinctions.length?`<h4>Distinctions</h4><ul class="lignes">${distinctions.map(d=>`<li><b>${d}</b></li>`).join("")}</ul>`:""}
      </div>
      <div class="lien">${c.source?`<a href="${echapper(c.source)}" target="_blank" rel="noopener">Fiche officielle</a>`:""}${c.portrait?` · <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(c.portrait)}" target="_blank" rel="noopener">crédit du portrait</a>`:""}</div>
      ${pied}
    </div></div></div>`;
}

/* ---------- Paquet ---------- */
function majCompteur(){
  const r = restants();
  document.getElementById("restants").textContent = r > 0 ? `${r} paquet${r>1?"s":""} à ouvrir aujourd'hui.` : "Vous avez ouvert vos trois paquets du jour. Les suivants seront disponibles demain.";
}
function afficherPaquet(){
  majCompteur();
  const scene = document.getElementById("scene");
  if (restants() <= 0) { scene.innerHTML = `<button class="bouton discret" onclick="document.querySelector('[data-vue=collection]').click()">Voir ma collection</button>`; return; }
  scene.innerHTML = `<button class="paquet" id="paquet" aria-label="Ouvrir le paquet">
      <div class="corps-paquet"><div class="bordure"></div>
        <div class="logo"><strong>Hémicycle</strong><span>Parlementaires de France<br>1789&nbsp;–&nbsp;2026</span></div>
        <div class="eventail"><i></i><i></i><i><b>H</b></i></div></div>
      <div class="soudure haut"></div><div class="ligne-ouverture"></div><div class="soudure bas"></div>
    </button><p class="progres">Touchez le paquet pour le déchirer.</p>`;
  document.getElementById("paquet").addEventListener("click", ouvrir);
}
function ouvrir(){
  if (restants() <= 0) return;
  // Une carte au moins parmi les élus et ministres en exercice, les autres au hasard
  const tirage = [tirerCarte(actuelsParRarete)].concat(Array.from({length:CARTES_PAR_PAQUET-1}, () => tirerCarte()))
    .sort((a,b) => ORDRE.indexOf(a.rarete)-ORDRE.indexOf(b.rarete) || a.score-b.score);
  const neuves = new Set(tirage.filter(c => !etat.possedees[c.id]).map(c => c.id));
  tirage.forEach(c => etat.possedees[c.id] = (etat.possedees[c.id]||0) + 1);
  etat.ouverts += 1; sauver(); majCompteur(); majCollection();
  const p = document.getElementById("paquet"); p.classList.add("ouvert"); p.disabled = true;
  setTimeout(() => montrer(tirage, neuves, 0), reduit() ? 0 : 900);
}
function reduit(){ return matchMedia("(prefers-reduced-motion: reduce)").matches; }
function montrer(tirage, neuves, i){
  const scene = document.getElementById("scene");
  if (i >= tirage.length) {
    scene.innerHTML = `<div class="grille recap">${tirage.map(c => htmlCarte(c,{neuve:neuves.has(c.id)})).join("")}</div>
      <p class="progres">${neuves.size} nouvelle${neuves.size>1?"s":""} carte${neuves.size>1?"s":""}. Touchez une carte pour la retourner.</p>
      ${restants()>0?'<button class="bouton" id="suivant">Ouvrir un autre paquet</button>':'<button class="bouton discret" id="voir">Voir ma collection</button>'}`;
    document.getElementById("suivant")?.addEventListener("click", afficherPaquet);
    document.getElementById("voir")?.addEventListener("click", () => document.querySelector('[data-vue="collection"]').click());
    return;
  }
  const c = tirage[i];
  scene.innerHTML = htmlCarte(c, {retournee:false, neuve:neuves.has(c.id), classe:"grande", id:"courante"})
    + `<div class="actions"><button class="bouton discret" id="envers">Voir le verso</button><button class="bouton" id="suite">${i+1<tirage.length?`Carte suivante (${i+2}/${tirage.length})`:"Voir le paquet"}</button></div>`;
  const el = document.getElementById("courante");
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("retournee")));
  const suivante = () => montrer(tirage, neuves, i+1);
  el.addEventListener("click", suivante);
  document.getElementById("suite").addEventListener("click", suivante);
  document.getElementById("suite").focus();
  document.getElementById("envers").addEventListener("click", e => {
    el.classList.toggle("envers");
    e.target.textContent = el.classList.contains("envers") ? "Voir le recto" : "Voir le verso";
  });
}

/* ---------- Collection ---------- */
function majCollection(){
  const possedees = cartes.filter(c => etat.possedees[c.id]);
  document.getElementById("progression").innerHTML = `<li><strong>${possedees.length.toLocaleString("fr-FR")}</strong>cartes sur ${cartes.length.toLocaleString("fr-FR")}</li>` +
    ORDRE.slice().reverse().filter(r => parRarete[r]?.length).map(r => `<li><strong>${possedees.filter(c=>c.rarete===r).length}</strong>${LIBELLES[r].toLowerCase()} sur ${parRarete[r].length.toLocaleString("fr-FR")}</li>`).join("");
  const q = document.getElementById("recherche").value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const f = document.getElementById("filtre").value, tri = document.getElementById("tri").value;
  const liste = possedees.filter(c => (!f || c.rarete===f || (f==="actuel" && c.actuel)) && (!q || c.cherche.includes(q)))
    .sort(tri==="nom" ? (a,b)=>a.nom.localeCompare(b.nom,"fr") : tri==="annee" ? (a,b)=>(a.debut||0)-(b.debut||0) : (a,b)=>b.score-a.score);
  const grille = document.getElementById("grille");
  grille.innerHTML = liste.length ? liste.slice(0,200).map(c => htmlCarte(c)).join("")
    : `<p class="vide">${possedees.length ? "Aucune carte de votre collection ne correspond à cette recherche." : "Votre collection est vide. Ouvrez un paquet pour obtenir vos premières cartes."}</p>`;
  if (liste.length > 200) grille.insertAdjacentHTML("beforeend", `<p class="vide">${liste.length-200} autres cartes : affinez la recherche pour les afficher.</p>`);
}
// Toucher une carte de la collection ou du récapitulatif la retourne (recto / verso) ; les liens restent cliquables
document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const el = e.target.closest(".grille .carte");
  if (el) { el.classList.remove("statique"); el.classList.toggle("envers"); }
});
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x===b));
  document.querySelectorAll(".vue").forEach(v => v.hidden = v.id !== "vue-"+b.dataset.vue);
}));
["recherche","filtre","tri"].forEach(id => document.getElementById(id).addEventListener("input", majCollection));

fetch("jeu.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  cartes = d.cartes.map(([id,nom,r,score,epoque,actuel,debut,fin,source,portrait,distinctions,chambres,sexe,fonctions,mandats]) => ({
    id,nom,rarete:d.raretes[r],score,epoque,actuel:!!actuel,debut,fin,source,portrait,distinctions:distinctions||[],chambres:chambres||"",sexe,
    fonctions:fonctions||[],mandats:mandats||[],
    cherche:(nom+" "+epoque+" "+(fonctions||[]).map(f=>f[0]).join(" ")+" "+(mandats||[]).map(m=>m[1]).join(" ")).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}));
  cartes.forEach(c => { (parRarete[c.rarete] ||= []).push(c); if (c.actuel) (actuelsParRarete[c.rarete] ||= []).push(c); });
  if (!Object.keys(actuelsParRarete).length) actuelsParRarete = parRarete;
  const filtre = document.getElementById("filtre");
  filtre.insertAdjacentHTML("beforeend", `<option value="actuel">En exercice</option>`);
  ORDRE.slice().reverse().filter(r => parRarete[r]?.length).forEach(r => filtre.insertAdjacentHTML("beforeend", `<option value="${r}">${LIBELLES[r]}</option>`));
  afficherPaquet(); majCollection();
}).catch(() => { document.getElementById("restants").textContent = "Les cartes n'ont pas pu être chargées. Vérifiez que le fichier jeu.json est publié à côté de cette page, puis rechargez."; });
</script>
</body>
